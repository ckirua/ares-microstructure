# TI-v-fade paper shadow — directional taker fade (NOT MM).
# SHADOW PAPER fills only; live_orders must stay false.

mode: SHADOW_PAPER
class: directional_v_fade
live_orders: false

# Primary cell (expand after HL ETH green)
venue: hyperliquid
symbol: ETH
extra_venues: []   # e.g. [deribit, kraken]

# Detection (mirrors paper_harness / _common)
z_star: 6.0
sigma_m_frac: 1.0
gate:
  min_dp_pct: 0.10
  min_i_c: 5
intensity_window_s: 60.0
nanex_slack_s: 0.5

# V-fade parameters — Promote_shadow default from out/gap_summary.json
# entry_mode:
#   confirm_r2   — lab scoreboard only: wait +2s, require r2 V (path-late; Hold on path)
#   severity_zend — executable: |z|≥z_min at ts_end+delay; NO r2 (Promote_shadow)
v_fade:
  entry_mode: severity_zend
  confirm_s: 0.5              # OE buffer after ts_end (best path: +0.5s)
  exit_s: 3.0                 # best path horizon
  z_min: 20.0                 # |z_peak| gate
  soft_confirm_r1: 0.35       # confirm_r2 only
  v_threshold_r2: 0.5         # confirm_r2 only
  cont_threshold_r2: 0.2
  rt_friction_bps: 4.0
  friction_bps_one_way: 2.0
  adverse_stop_bps: 1.0e9     # off (null in gap_summary → disabled)
  max_concurrent: 1
  clip_notional: 1.0
  suppress_fire_pause: prior_only  # allow own fire ts_end; block follow-ons 300s
  fire_pause_5m_s: 300.0
  n_boot: 800
  early_days: ["2026-09-04", "2026-09-05", "2026-09-06"]
  late_days: ["2026-09-07", "2026-09-08", "2026-09-09", "2026-09-10"]

fire_pause_5m_s: 300.0

# Kill criteria thresholds (spec §7)
kill:
  k1_rolling_days: 5
  k1_min_n: 20
  k2_n_boot: 800
  k4_hit_rate_kill: 0.55
  k4_hit_rate_warn: 0.65
  k4_min_n: 40
  k5_adverse_share: 0.40
  k5_min_n: 30
  k6_median_one_way_bps: 5.0

# Living shadow poller (run_v_fade_shadow_live.py --poll)
# Warehouse lag is minutes–hours; 120s is enough. NOT paper_live's 10s ladder wake.
poll_interval_s: 120

# Outputs
out_dir: out
require_complete_day: true
log_dir: logs
log_file: v_fade_shadow.log
