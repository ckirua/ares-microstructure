# cd_me paper_shadow — PIM / DCM monitor SHADOW (no exchange orders).
#
# All research gates Hold until Pass 2. Never soft-Promote.
# Never mercat/gateway OE. ClickHouse MCP banned.

mode: paper
class: risk_monitor_shadow
live_orders: false
alpha_claim: false

# Primary cell (HL ETH); extras optional when TOB available
venue: hyperliquid
symbol: ETH
extra_venues: [deribit, kraken]

# Poll loop — warehouse day recompute
poll_interval_s: 120.0
require_complete_day: false
lookback_days: 21
max_files: 48
dt_s: 5.0
max_lag_s: 30.0
bucket_s: 3600.0

# Gate stamp (hard-pinned honesty — Pass 1 Hold board)
gates:
  risk.pim_cross_venue: Hold
  risk.dcm_pc1: Hold
  liq.elasticity_regime: Hold
  info.vloop_tcost_commonality: Hold
  alpha.tob_cross_arb: Kill
  risk.bank_cds_var: Kill

# Outputs
out_dir: out
log_dir: logs
log_file: shadow.log
log_rotate: daily
log_max_bytes: 10485760
log_backup_count: 14
events_jsonl: events.jsonl
